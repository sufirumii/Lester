<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Lester — Your AI. Your hardware. Your proof.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A241D"/>
      <stop offset="1" stop-color="#0E3A2E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ECF94" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ECF94" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mark, scaled 2x -->
  <g transform="translate(96,168) scale(2)">
    <rect x="6" y="6" width="52" height="52" rx="13" fill="#3ECF94"/>
    <path d="M22 19 H33 V34 H48 V45 H22 Z" fill="#0F1512"/>
    <rect x="36" y="21.5" width="9" height="9" rx="2.2" fill="#3ECF94"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="248" y="248" font-family="'Inter Variable','Inter',system-ui,sans-serif" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#F4F4F0">Lester</text>
  <text x="250" y="308" font-family="'Inter Variable','Inter',system-ui,sans-serif" font-size="30" font-weight="400" fill="#9DC4B4">Your AI. Your hardware. Your proof.</text>

  <!-- Hash-chain ledger motif -->
  <g transform="translate(96,420)">
    <rect x="0" y="0" width="56" height="36" rx="8" fill="none" stroke="#3ECF94" stroke-opacity="0.5"/>
    <rect x="92" y="0" width="56" height="36" rx="8" fill="none" stroke="#3ECF94" stroke-opacity="0.5"/>
    <rect x="184" y="0" width="56" height="36" rx="8" fill="none" stroke="#3ECF94" stroke-opacity="0.5"/>
    <rect x="276" y="0" width="56" height="36" rx="8" fill="none" stroke="#3ECF94" stroke-opacity="0.5"/>
    <line x1="56" y1="18" x2="92" y2="18" stroke="#3ECF94" stroke-opacity="0.5"/>
    <line x1="148" y1="18" x2="184" y2="18" stroke="#3ECF94" stroke-opacity="0.5"/>
    <line x1="240" y1="18" x2="276" y2="18" stroke="#3ECF94" stroke-opacity="0.5"/>
    <text x="12" y="23" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3ECF94" fill-opacity="0.9">a3f…</text>
    <text x="104" y="23" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3ECF94" fill-opacity="0.9">7b1…</text>
    <text x="196" y="23" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3ECF94" fill-opacity="0.9">e02…</text>
    <text x="288" y="23" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#3ECF94" fill-opacity="0.9">→</text>
  </g>
  <text x="96" y="510" font-family="'Inter Variable','Inter',system-ui,sans-serif" font-size="19" fill="#7FA695">Every request. Which model. Where it ran. Whether any byte left the machine.</text>
</svg>
